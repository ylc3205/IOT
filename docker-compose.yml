services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-parking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-smart_parking_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_parking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: smart-parking-mosquitto
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/config/password.txt:/mosquitto/config/password.txt:ro
      - ./docker/mosquitto/config/acl.txt:/mosquitto/config/acl.txt:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -u ${MQTT_USERNAME:-smartparking_user} -P ${MQTT_PASSWORD:-smartparking_secret} -t 'smartparking/healthcheck' -E -i healthcheck-probe || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: smart_parking_postgres_data
  mosquitto_data:
    name: smart_parking_mosquitto_data
  mosquitto_log:
    name: smart_parking_mosquitto_log

